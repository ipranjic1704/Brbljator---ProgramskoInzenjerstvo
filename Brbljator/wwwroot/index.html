<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Brbljator – prijava</title>
    <link rel="stylesheet" href="stil.css">
</head>
<body>
    <!-- SCRUM-39: ekran za prijavu -->
    <main class="kartica">
        <h1>Brbljator</h1>
        <form id="forma">
            <label>Korisničko ime ili e-mail
                <input id="ime" autocomplete="username" required>
            </label>
            <label>Lozinka
                <input id="lozinka" type="password" autocomplete="current-password" required>
            </label>
            <button type="submit">Prijava</button>
            <!-- SCRUM-41: poruka za pogrešnu prijavu -->
            <p id="poruka" class="greska" role="alert"></p>
        </form>
    </main>

    <script>
        const ime = document.getElementById("ime");
        const lozinka = document.getElementById("lozinka");
        const poruka = document.getElementById("poruka");

        document.getElementById("forma").addEventListener("submit", async (e) => {
            e.preventDefault();
            poruka.textContent = "";

            const odgovor = await fetch("/api/auth/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ korisnickoIme: ime.value, lozinka: lozinka.value })
            });
            const podaci = await odgovor.json().catch(() => ({}));

            if (!odgovor.ok) {
                poruka.textContent = podaci.poruka ?? "Prijava nije uspjela.";
                lozinka.value = "";
                lozinka.focus();
                return;
            }

            // Admin ide na upravljanje korisnicima, ostali na početnu
            location.href = podaci.isAdmin ? "admin.html" : "pocetna.html";
        });
    </script>
</body>
</html>
